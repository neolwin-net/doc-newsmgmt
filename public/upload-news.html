<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Publish News | Document & News</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">DN</span><span>Document <b>&</b> News</span></a><button class="menu-toggle" id="menuToggle">☰</button><nav class="main-nav" id="mainNav"><a href="/">Home</a><a href="/documents.html">Documents</a><a href="/news.html">News</a><a class="nav-cta active" href="/upload-news.html">Publish news</a></nav></header>
<main class="page-shell narrow-shell"><section class="page-intro"><span class="eyebrow">CONTRIBUTE / NEWSROOM</span><h1>Publish an <span>update.</span></h1><p>Share an announcement or story with everyone using this site.</p></section>
<section class="form-card"><form id="uploadNewsForm"><div class="form-grid"><label class="field full"><span>News title <em>*</em></span><input name="title" required maxlength="200" placeholder="Write a clear, engaging headline"></label><label class="field"><span>Category <em>*</em></span><div class="category-controls"><select name="category" required data-category-type="news"></select><button class="btn btn-glass btn-add-category" type="button" data-add-category-type="news">＋ Add category</button><button class="btn btn-glass btn-delete-category" type="button" data-delete-category-type="news" title="Delete selected custom category" aria-label="Delete selected custom category">− Delete</button></div></label><label class="field"><span>Publication date <em>*</em></span><input name="date" type="date" required id="newsDate"></label><div class="field full"><span>News photo <em>*</em></span><label class="drop-zone photo-drop" for="newsPhoto"><span class="upload-symbol">▧</span><b>Choose a cover photo</b><small>PNG, JPG or JPEG · Maximum size 15 MB</small><span class="selected-file" id="selectedPhoto">No photo selected</span><input id="newsPhoto" name="photo" type="file" accept=".png,.jpg,.jpeg,image/png,image/jpeg" required></label><img id="photoPreview" class="photo-preview hidden" alt="Selected news photo preview"></div><label class="field full"><span>News content <em>*</em></span><textarea name="content" rows="10" required maxlength="50000" placeholder="Write the full news article here…"></textarea></label></div><div class="form-actions"><a class="btn btn-ghost-dark" href="/news.html">Cancel</a><button class="btn btn-primary" id="publishButton" type="submit">Publish news ↗</button></div><div id="formMessage" class="form-message" aria-live="polite"></div></form></section></main>
<footer class="site-footer"><a class="brand footer-brand" href="/"><span class="brand-mark">DN</span><span>Document <b>&</b> News</span></a><span>© <span data-current-year></span> Document & News Management System. All rights reserved.</span><span>Local knowledge. Shared clearly.</span></footer><script src="/js/site.js"></script><script src="/js/categories.js"></script><script src="/js/upload-news.js"></script></body></html>
